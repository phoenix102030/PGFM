[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgfm"
version = "0.1.0"
description = "Physics-guided flow matching for TEC forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "PyYAML>=6", "h5py>=3.8"]

[project.scripts]
pgfm-train = "pgfm.cli.train:main"
pgfm-evaluate = "pgfm.cli.evaluate:main"
pgfm-train-physics = "pgfm.cli.train_physics:main"
pgfm-predict-physics = "pgfm.cli.predict_physics:main"

[tool.setuptools.packages.find]
include = ["pgfm*"]
